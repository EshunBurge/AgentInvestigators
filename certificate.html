<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate · Agent Investigator</title><link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070506;color:#fff;font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(960px,100%)}
.cert{background:#fff;color:#111;border:14px solid #ff2a3d;outline:3px solid #111;outline-offset:-26px;padding:56px 40px;text-align:center;position:relative}
.cert small{letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:.75rem;color:#ff2a3d}
.cert h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(2.2rem,7vw,4.4rem);text-transform:uppercase;margin:10px 0}
.cert .nm{font-family:Anton,sans-serif;font-size:clamp(1.8rem,5vw,3rem);border-bottom:3px solid #111;display:inline-block;padding:0 24px;margin:14px 0}
.cert p{font-size:1.1rem;margin:10px 0}.stamp{display:inline-block;margin-top:24px;border:4px solid #ff2a3d;color:#ff2a3d;padding:8px 20px;font-family:Anton,sans-serif;font-size:1.5rem;transform:rotate(-6deg);letter-spacing:.1em}
.bar{display:flex;gap:12px;justify-content:center;margin-top:20px}
.b{background:#ff2a3d;color:#fff;border:0;border-radius:12px;padding:14px 22px;font:800 .9rem Inter;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}.g{background:transparent;border:2px solid #555}
@media print{body{background:#fff;padding:0}.bar{display:none}}
</style></head><body>
<div class="wrap"><div class="cert" id="cert"></div><div class="bar"><button class="b" onclick="print()">Print or save as PDF</button><a class="b g" href="dashboard.html#me">Back to dossier</a></div></div>
<script src="js/firebase-config.js"></script><script src="js/ai-backend.js"></script><script src="js/app.js"></script>
<script>
AI.ready(()=>{const id=new URLSearchParams(location.search).get('c'),s=AI.state(),c=s.certs[id],u=AI.user||{};
const el=document.getElementById('cert');
if(!c){el.innerHTML='<h1>No certificate yet</h1><p>Finish every lesson in a chapter to earn its certificate.</p>';return}
const nm=[u.first,u.last].filter(Boolean).join(' ')||'Agent';
el.innerHTML='<small>Agent Investigator · Ramble Ventures</small><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm">'+AI.esc(nm)+'</div><p>has completed the chapter</p><h2 style="font-family:Anton;font-weight:400;font-size:2rem;text-transform:uppercase;margin:6px 0">'+AI.esc(c.title)+'</h2><p>'+AI.esc(c.path)+' pathway · '+new Date(c.when).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+'</p><div class="stamp">CLEARED</div>';});
</script></body></html>
